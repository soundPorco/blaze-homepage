<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
    </head>
    <body>
        <table>
            <thead>
                <tr>
                    <th scope="col">クラス</th>
                    <th scope="col">月曜日</th>
                    <th scope="col">火曜日</th>
                    <th scope="col">水曜日</th>
                    <th scope="col">木曜日</th>
                    <th scope="col">金曜日</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th>BASIC</th>
                    <td>19:15~20:15</td>
                    <td>18:15~19:45</td>
                    <td>18:15~19:45</td>
                    <td>✖️</td>
                    <td>19:15~20:15</td>
                </tr>
                <tr>
                    <th>ADVANCE</th>
                    <td>✖️</td>
                    <td>20:00~21:30</td>
                    <td>20:00~21:30</td>
                    <td>20:00~21:30</td>
                    <td>✖️</td>
                </tr>
                <tr>
                    <th>運動キッズクラス</th>
                    <td>18:00~18:50</td>
                    <td>✖️</td>
                    <td>✖️</td>
                    <td>✖️</td>
                    <td>✖️</td>
                </tr>
            </tbody>
        </table>
        <style>
            table {
                border-collapse: collapse;
                width: clamp(900px, 90%, 1000px);
                margin: 20px auto;
                font-size: 1rem;
                text-align: center;
                border: 1px solid gray;
            }

            thead th {
                background-color: black;
                color: white;
                font-weight: bold;
                padding: 10px;
            }

            tbody tr {
                border-bottom: 1px solid gray;
            }

            tbody tr:nth-child(even) {
                background-color: #f9f9f9;
            }

            tbody tr:hover {
                background-color: #e6f2fa;
            }

            th,
            td {
                padding: 10px;
                border-right: 1px solid gray; /* 縦線を追加 */
            }

            th:last-child,
            td:last-child {
                border-right: none; /* 最後の列の縦線を削除 */
            }

            @media (max-width: 768px) {
                table {
                    display: block;
                    overflow-x: auto;
                    white-space: nowrap;
                }

                thead {
                    display: table;
                    width: 100%;
                    table-layout: fixed;
                }

                tbody {
                    display: table;
                    width: 100%;
                    table-layout: fixed;
                }
            }
        </style>
    </body>
</html>
